<h2>Generador de Informe del Viajero</h2>

<div class="viajeros-wrapper">
    <div class="viajeros-datos">
        <h3>📋 Datos del paciente</h3>
        
        <!-- FILA 1: Sexo y Edad -->
        <div class="form-row">
            <div class="form-group">
                <label>Sexo</label>
                <select id="sexo" class="input-field">
                    <option value="">Seleccione...</option>
                    <option value="Hombre">Hombre</option>
                    <option value="Mujer">Mujer</option>
                </select>
            </div>
            <div class="form-group">
                <label>Edad</label>
                <input type="number" id="edad" class="input-field" placeholder="Ej: 30">
            </div>
        </div>

        <!-- FILA 2: Fechas -->
        <div class="form-row">
            <div class="form-group">
                <label>Fecha de salida</label>
                <input type="date" id="salida" class="input-field">
            </div>
            <div class="form-group">
                <label>Fecha de regreso</label>
                <input type="date" id="regreso" class="input-field">
            </div>
        </div>

        <!-- FILA 3: Alojamiento y Motivo -->
        <div class="form-row">
            <div class="form-group">
                <label>Alojamiento</label>
                <select id="alojamiento" class="input-field">
                    <option value="">Seleccione...</option>
                    <option value="Hotel">Hotel</option>
                    <option value="Casa familiar">Casa familiar</option>
                    <option value="Casa de amigos">Casa de amigos</option>
                    <option value="Camping">Camping</option>
                    <option value="ONG">ONG</option>
                    <option value="Campus">Campus</option>
                </select>
            </div>
            <div class="form-group">
                <label>Motivo del viaje</label>
                <select id="motivo" class="input-field">
                    <option value="">Seleccione...</option>
                    <option value="Turismo">Turismo</option>
                    <option value="Estudios">Estudios</option>
                    <option value="Trabajo">Trabajo</option>
                    <option value="Visita familiar">Visita familiar</option>
                </select>
            </div>
        </div>

        <!-- FILA 4: Viaje organizado y Malaria -->
        <div class="form-row">
            <div class="form-group">
                <label>Viaje organizado</label>
                <select id="organizado" class="input-field">
                    <option value="">Seleccione...</option>
                    <option value="Sí">Sí</option>
                    <option value="No">No</option>
                </select>
            </div>
            <div class="form-group">
                <label>Profilaxis malaria</label>
                <select id="malaria" class="input-field">
                    <option value="">Seleccione...</option>
                    <option value="Recomendada">Recomendada</option>
                    <option value="No recomendada">No recomendada</option>
                </select>
            </div>
        </div>

        <!-- FILA 5: RVN y Zonas de estancia -->
        <div class="form-row">
            <div class="form-group">
                <label>RVN</label>
                <input type="text" id="rvn" class="input-field" placeholder="Ej: A123456">
            </div>
            <div class="form-group">
                <label>Zonas de estancia</label>
                <input type="text" id="estancia" class="input-field" placeholder="Ej: Zona urbana">
            </div>
        </div>

        <!-- FILA 6: Países -->
        <div class="form-row">
            <div class="form-group">
                <label>País 1</label>
                <select id="pais1" class="input-field">
                    <option value="">Seleccione país...</option>
                </select>
            </div>
            <div class="form-group" id="pais2-container" style="display: none;">
                <label>País 2</label>
                <select id="pais2" class="input-field">
                    <option value="">Seleccione país...</option>
                </select>
            </div>
        </div>

        <!-- FILA 7: Vacunas recomendadas -->
        <div class="form-group full-width">
            <label>🩹 Vacunas recomendadas</label>
            <div class="vacunas-container">
                <label class="checkbox-item">
                    <input type="checkbox" value="Cólera">
                    <span>Cólera</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" value="Dengue">
                    <span>Dengue</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" value="Encefalitis Centroeuropea">
                    <span>Encefalitis Centroeuropea</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" value="Encefalitis Japonesa">
                    <span>Encefalitis Japonesa</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" value="Fiebre amarilla">
                    <span>Fiebre amarilla</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" value="Fiebre tifoidea oral">
                    <span>Fiebre tifoidea oral</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" value="Fiebre tifoidea inyectable">
                    <span>Fiebre tifoidea inyectable</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" value="Men ACWY">
                    <span>Men ACWY</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" value="MPox">
                    <span>MPox</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" value="Polio">
                    <span>Polio</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" value="Rabia">
                    <span>Rabia</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" value="Tétanos">
                    <span>Tétanos</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" value="TV">
                    <span>TV</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" value="VHA">
                    <span>VHA</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" value="VHB">
                    <span>VHB</span>
                </label>
            </div>
        </div>
    </div>

    <!-- Sección de informe generado -->
    <div class="viajeros-resultado">
        <h3>📄 Informe generado</h3>
        <div id="resultado" class="resultado-box"></div>
    </div>
</div>

<style>
.viajeros-wrapper {
    display: flex;
    flex-direction: column;
    gap: 25px;
    margin-top: 20px;
}

.viajeros-datos {
    background: linear-gradient(135deg, #f0f9ff 0%, #e0f7ff 100%);
    border-radius: 12px;
    padding: 25px;
    box-shadow: 0 4px 15px rgba(38, 198, 218, 0.1);
    border: 2px solid #b2ebf2;
}

.viajeros-datos h3 {
    color: #00838f;
    margin-top: 0;
    margin-bottom: 20px;
    font-size: 18px;
    border-bottom: 3px solid #26c6da;
    padding-bottom: 10px;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-bottom: 15px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-group label {
    margin-bottom: 8px;
    font-weight: 600;
    color: #00695c;
    font-size: 14px;
}

.input-field {
    padding: 12px;
    border: 2px solid #b2ebf2;
    border-radius: 8px;
    font-size: 14px;
    background: white;
    color: #333;
    transition: all 0.3s ease;
    font-family: inherit;
}

.input-field:focus {
    outline: none;
    border-color: #26c6da;
    box-shadow: 0 0 8px rgba(38, 198, 218, 0.3);
    background-color: #f0fafb;
}

.input-field:hover {
    border-color: #00acc1;
}

.full-width {
    grid-column: 1 / -1;
}

.vacunas-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    border: 2px solid #b2ebf2;
    border-radius: 8px;
    padding: 15px;
    background: white;
    max-height: 300px;
    overflow-y: auto;
}

.checkbox-item {
    display: flex;
    align-items: center;
    padding: 10px;
    cursor: pointer;
    color: #333;
    transition: all 0.2s ease;
    border-radius: 6px;
    user-select: none;
}

.checkbox-item:hover {
    background: #e0f7fa;
    color: #00695c;
}

.checkbox-item input[type="checkbox"] {
    margin-right: 8px;
    width: 18px;
    height: 18px;
    cursor: pointer;
    accent-color: #26c6da;
}

.checkbox-item span {
    flex: 1;
}

.viajeros-resultado {
    background: linear-gradient(135deg, #f0f9ff 0%, #e0f7ff 100%);
    border-radius: 12px;
    padding: 25px;
    box-shadow: 0 4px 15px rgba(38, 198, 218, 0.1);
    border: 2px solid #b2ebf2;
}

.viajeros-resultado h3 {
    color: #00838f;
    margin-top: 0;
    margin-bottom: 20px;
    font-size: 18px;
    border-bottom: 3px solid #26c6da;
    padding-bottom: 10px;
}

.resultado-box {
    background: white;
    border: 2px solid #26c6da;
    border-radius: 8px;
    padding: 20px;
    min-height: 200px;
    color: #333;
    font-size: 14px;
    line-height: 1.8;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

@media (max-width: 768px) {
    .form-row {
        grid-template-columns: 1fr;
    }

    .vacunas-container {
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    }
}
</style>

<script>
// Lista de países
const paises = [
    "Afganistán","Albania","Alemania","Andorra","Angola","Arabia Saudí",
    "Argelia","Argentina","Armenia","Australia","Austria","Azerbaiyán",
    "Bahamas","Bangladés","Barbados","Bélgica","Belice","Benín","Bolivia",
    "Bosnia y Herzegovina","Botsuana","Brasil","Brunéi","Bulgaria",
    "Burkina Faso","Burundi","Camboya","Camerún","Canadá","Catar","Chad",
    "Chile","China","Chipre","Colombia","Corea del Norte","Corea del Sur",
    "Costa Rica","Costa de Marfil","Croacia","Cuba","Dinamarca","Ecuador",
    "Egipto","El Salvador","Emiratos Árabes Unidos","Eritrea","Eslovaquia",
    "Eslovenia","España","Estados Unidos","Estonia","Etiopía","Filipinas",
    "Finlandia","Francia","Gabón","Gambia","Georgia","Ghana","Grecia",
    "Guatemala","Guinea","Guinea Ecuatorial","Guyana","Haití","Honduras",
    "Hungría","India","Indonesia","Irak","Irán","Irlanda","Islandia",
    "Israel","Italia","Jamaica","Japón","Jordania","Kenia","Kuwait","Laos",
    "Letonia","Líbano","Liberia","Libia","Lituania","Luxemburgo",
    "Madagascar","Malasia","Malaui","Maldivas","Malí","Malta","Marruecos",
    "Mauricio","Mauritania","México","Moldavia","Mongolia","Mozambique",
    "Myanmar","Namibia","Nepal","Nicaragua","Níger","Nigeria","Noruega",
    "Nueva Zelanda","Omán","Países Bajos","Pakistán","Panamá","Papúa Nueva Guinea",
    "Paraguay","Perú","Polonia","Portugal","Reino Unido","República Checa",
    "República Dominicana","Rumanía","Rusia","Senegal","Serbia","Singapur",
    "Siria","Somalia","Sri Lanka","Sudáfrica","Sudán","Suecia","Suiza",
    "Tailandia","Taiwán","Tanzania","Togo","Túnez","Turquía","Ucrania",
    "Uganda","Uruguay","Uzbekistán","Venezuela","Vietnam","Yemen","Zambia","Zimbabue"
];

// Esperar a que el DOM esté listo
function inicializar() {
    // Cargar países en los select
    const pais1 = document.getElementById("pais1");
    const pais2 = document.getElementById("pais2");
    
    if (pais1 && pais2) {
        paises.forEach(pais => {
            const option1 = document.createElement("option");
            option1.value = pais;
            option1.textContent = pais;
            pais1.appendChild(option1);
            
            const option2 = document.createElement("option");
            option2.value = pais;
            option2.textContent = pais;
            pais2.appendChild(option2);
        });
    }

    // Mostrar/ocultar País 2
    const pais1Elem = document.getElementById("pais1");
    if (pais1Elem) {
        pais1Elem.addEventListener("change", function() {
            const pais2Container = document.getElementById("pais2-container");
            if (this.value) {
                pais2Container.style.display = "block";
            } else {
                pais2Container.style.display = "none";
                document.getElementById("pais2").value = "";
            }
            generarInforme();
        });
    }

    // Agregar listeners a todos los campos
    document.querySelectorAll('.input-field').forEach(campo => {
        campo.addEventListener('change', generarInforme);
        campo.addEventListener('input', generarInforme);
    });

    document.querySelectorAll('.vacunas-container input[type="checkbox"]').forEach(checkbox => {
        checkbox.addEventListener('change', generarInforme);
    });

    const organizadoElem = document.getElementById("organizado");
    if (organizadoElem) {
        organizadoElem.addEventListener("change", generarInforme);
    }

    // Generar informe inicial
    generarInforme();
}

// Generar informe
function generarInforme() {
    const sexo = document.getElementById("sexo")?.value || "_____";
    const edad = document.getElementById("edad")?.value || "_____";
    const salida = document.getElementById("salida")?.value || "_____";
    const regreso = document.getElementById("regreso")?.value || "_____";
    const alojamiento = document.getElementById("alojamiento")?.value || "_____";
    const motivo = document.getElementById("motivo")?.value || "_____";
    const organizado = document.getElementById("organizado")?.value || "_____";
    const estancia = document.getElementById("estancia")?.value || "_____";
    const rvn = document.getElementById("rvn")?.value || "_____";
    const malaria = document.getElementById("malaria")?.value || "_____";
    
    // Obtener países seleccionados
    const pais1 = document.getElementById("pais1")?.value;
    const pais2 = document.getElementById("pais2")?.value;
    let paisesTexto = pais1 || "_____";
    if (pais2) {
        paisesTexto = pais1 + " y " + pais2;
    }
    
    // Obtener vacunas seleccionadas
    const vacunasSeleccionadas = [];
    document.querySelectorAll('.vacunas-container input[type="checkbox"]:checked').forEach(checkbox => {
        vacunasSeleccionadas.push(checkbox.value);
    });
    const vacunasTexto = vacunasSeleccionadas.length > 0 ? vacunasSeleccionadas.join(", ") : "_____";
    
    // Calcular duración del viaje
    let dias = "_____";
    if (salida && regreso) {
        const fechaSalida = new Date(salida);
        const fechaRegreso = new Date(regreso);
        const diferencia = Math.ceil((fechaRegreso - fechaSalida) / (1000 * 60 * 60 * 24));
        dias = diferencia > 0 ? diferencia : "_____";
    }
    
    // Determinar si es "organizado" o "no organizado"
    let tipoViaje = "_____";
    if (organizado === "Sí") {
        tipoViaje = "organizado";
    } else if (organizado === "No") {
        tipoViaje = "no organizado";
    }
    
    // Construir el informe
    const informe = `RVN: ${rvn}


Paciente ${sexo}, de ${edad} años, que consulta por viaje que va a realizar a ${paisesTexto}. Estancia en: ${alojamiento}. Salida el ${salida}. Regreso el ${regreso}. Duración del viaje: ${dias} días. Viaje ${tipoViaje} con estancia en ${estancia}. Motivo del viaje: ${motivo}



Se valora riesgo de enfermedades transmitidas por picadura de mosquito y damos recomendaciones para evitarlas.

Administramos el día de hoy

${vacunasTexto}

Profilaxis frente a la malaria: ${malaria}




Consejos y recomendaciones generales: Elegir ropa y calzado adecuados. Los vestidos deberán ser de fibras naturales (algodón, lino, etc.), ligeros, no ajustados y de colores claros, siendo aconsejable cambiarse de ropa a menudo. El calzado será amplio y ventilado para evitar infecciones por hongos. La exposición a los rayos del sol puede provocar graves y debilitantes insolaciones y quemaduras, usar sombrero, gafas de sol y aplicarse cremas con filtro solar. Evitar el contacto con cualquier tipo de animales, incluidos los domésticos, ya que éstos pueden no estar controlados sanitariamente. Se entrega hoja de recomendaciones generales y damos consejos para evitar picaduras de mosquitos.`;
    
    const resultadoDiv = document.getElementById("resultado");
    if (resultadoDiv) {
        resultadoDiv.textContent = informe;
    }
}

// Inicializar cuando el contenido esté cargado
setTimeout(inicializar, 100);
</script>
