<h2>Generador de Informe del Viajero</h2>

<div class="viajeros-container">

    <div class="viajeros-panel">

        <h3>📋 Datos del paciente</h3>

        <!-- FILA 1 -->
        <div class="form-row">

            <div class="form-group">
                <label>Sexo</label>
                <select id="sexo" class="viajeros-input">
                    <option>Hombre</option>
                    <option>Mujer</option>
                </select>
            </div>

            <div class="form-group">
                <label>Edad</label>
                <input type="number" id="edad" class="viajeros-input">
            </div>

        </div>

        <!-- FILA 2 -->
        <div class="form-row">

            <div class="form-group">
                <label>Fecha de salida</label>
                <input type="date" id="salida" class="viajeros-input">
            </div>

            <div class="form-group">
                <label>Fecha de regreso</label>
                <input type="date" id="regreso" class="viajeros-input">
            </div>

        </div>

        <!-- FILA 3 -->
        <div class="form-row">

            <div class="form-group">
                <label>Alojamiento</label>
                <select id="alojamiento" class="viajeros-input">
                    <option>Hotel</option>
                    <option>Casa familiar</option>
                    <option>Camping</option>
                    <option>Campus</option>
                    <option>ONG</option>
                </select>
            </div>

            <div class="form-group">
                <label>Motivo del viaje</label>
                <select id="motivo" class="viajeros-input">
                    <option>Turismo</option>
                    <option>Visita familiar</option>
                    <option>Trabajo</option>
                    <option>Estudio</option>
                </select>
            </div>

        </div>

        <!-- FILA 4 -->
        <div class="form-row">

            <div class="form-group">
                <label>Viaje organizado</label>
                <select id="organizado" class="viajeros-input">
                    <option>Sí</option>
                    <option>No</option>
                </select>
            </div>

            <div class="form-group">
                <label>Profilaxis malaria</label>
                <select id="malaria" class="viajeros-input">
                    <option>Recomendada</option>
                    <option>No recomendada</option>
                </select>
            </div>

        </div>

        <!-- FILA 5 -->
        <div class="form-row">

            <div class="form-group">
                <label>RVN</label>
                <input type="text" id="rvn" class="viajeros-input" placeholder="Ej: A123456">
            </div>

            <div class="form-group">
                <label>Zonas de estancia</label>
                <input type="text" id="estancia" class="viajeros-input" placeholder="Ej: Zona urbana">
            </div>

        </div>

        <!-- FILA 6 -->
        <div class="form-row">

            <div class="form-group">
                <label>País 1</label>
                <select id="pais1" class="viajeros-input" onchange="mostrarPais(2)">
                    <option value="">Seleccione país</option>
                </select>
            </div>

            <div class="form-group" id="pais2Div" style="display:none;">
                <label>País 2</label>
                <select id="pais2" class="viajeros-input" onchange="mostrarPais(3)">
                    <option value="">Seleccione país</option>
                </select>
            </div>

        </div>

        <!-- FILA 7 -->
        <div class="form-row">

            <div class="form-group" id="pais3Div" style="display:none;">
                <label>País 3</label>
                <select id="pais3" class="viajeros-input" onchange="mostrarPais(4)">
                    <option value="">Seleccione país</option>
                </select>
            </div>

            <div class="form-group" id="pais4Div" style="display:none;">
                <label>País 4</label>
                <select id="pais4" class="viajeros-input">
                    <option value="">Seleccione país</option>
                </select>
            </div>

        </div>

        <!-- FILA 8 -->
        <div class="form-row">

            <div class="form-group full-width">

                <label>🩹 Vacunas recomendadas</label>

                <div class="vacunas">

                    <label class="vacuna-item"><input type="checkbox" value="Cólera"> Cólera</label>
                    <label class="vacuna-item"><input type="checkbox" value="Dengue"> Dengue</label>
                    <label class="vacuna-item"><input type="checkbox" value="Encefalitis Centroeuropea"> Encefalitis Centroeuropea</label>
                    <label class="vacuna-item"><input type="checkbox" value="Encefalitis Japonesa"> Encefalitis Japonesa</label>
                    <label class="vacuna-item"><input type="checkbox" value="Fiebre amarilla"> Fiebre amarilla</label>
                    <label class="vacuna-item"><input type="checkbox" value="Fiebre tifoidea inyectable"> Fiebre tifoidea inyectable</label>
                    <label class="vacuna-item"><input type="checkbox" value="Fiebre tifoidea oral"> Fiebre tifoidea oral</label>
                    <label class="vacuna-item"><input type="checkbox" value="Men ACWY"> Men ACWY</label>
                    <label class="vacuna-item"><input type="checkbox" value="MPox"> MPox</label>
                    <label class="vacuna-item"><input type="checkbox" value="Polio"> Polio</label>
                    <label class="vacuna-item"><input type="checkbox" value="Rabia"> Rabia</label>
                    <label class="vacuna-item"><input type="checkbox" value="Tétanos"> Tétanos</label>
                    <label class="vacuna-item"><input type="checkbox" value="TV"> TV</label>
                    <label class="vacuna-item"><input type="checkbox" value="VHA"> VHA</label>
                    <label class="vacuna-item"><input type="checkbox" value="VHB"> VHB</label>

                </div>

            </div>

        </div>

    </div>

    <div class="viajeros-panel resultado-panel">

        <h3>📄 Informe generado</h3>

        <div id="resultado" class="preview"></div>

    </div>

</div>



<script>
const paises = [
"Afganistán","Albania","Alemania","Andorra","Angola","Arabia Saudí",
"Argelia","Argentina","Armenia","Australia","Austria","Azerbaiyán",
"Bahamas","Bangladés","Barbados","Bélgica","Belice","Benín","Bolivia",
"Bosnia y Herzegovina","Botsuana","Brasil","Brunéi","Bulgaria",
"Burkina Faso","Burundi","Camboya","Camerún","Canadá","Catar","Chad",
"Chile","China","Chipre","Colombia","Corea del Norte","Corea del Sur",
"Costa Rica","Costa de Marfil","Croacia","Cuba","Dinamarca","Ecuador",
"Egipto","El Salvador","Emiratos Árabes Unidos","Eritrea","Eslovaquia",
"Eslovenia","España","Estados Unidos","Estonia","Etiopía","Filipinas",
"Finlandia","Francia","Gabón","Gambia","Georgia","Ghana","Grecia",
"Guatemala","Guinea","Guinea Ecuatorial","Guyana","Haití","Honduras",
"Hungría","India","Indonesia","Irak","Irán","Irlanda","Islandia",
"Israel","Italia","Jamaica","Japón","Jordania","Kenia","Kuwait","Laos",
"Letonia","Líbano","Liberia","Libia","Lituania","Luxemburgo",
"Madagascar","Malasia","Malaui","Maldivas","Malí","Malta","Marruecos",
"Mauricio","Mauritania","México","Moldavia","Mongolia","Mozambique",
"Myanmar","Namibia","Nepal","Nicaragua","Níger","Nigeria","Noruega",
"Nueva Zelanda","Omán","Países Bajos","Pakistán","Panamá","Papúa Nueva Guinea",
"Paraguay","Perú","Polonia","Portugal","Reino Unido","República Checa",
"República Dominicana","Rumanía","Rusia","Senegal","Serbia","Singapur",
"Siria","Somalia","Sri Lanka","Sudáfrica","Sudán","Suecia","Suiza",
"Tailandia","Taiwán","Tanzania","Togo","Túnez","Turquía","Ucrania",
"Uganda","Uruguay","Uzbekistán","Venezuela","Vietnam","Yemen","Zambia","Zimbabue"
];

["pais1","pais2","pais3","pais4"].forEach(id=>{
    const select=document.getElementById(id);
    if(select) {
        paises.forEach(pais=>{
            select.innerHTML += `<option>${pais}</option>`;
        });
    }
});

function mostrarPais(numero){
    const div=document.getElementById(`pais${numero}Div`);
    if(div){
        div.style.display="block";
    }
    actualizar();
}

function actualizar(){
    const sexo=document.getElementById("sexo")?.value || "";
    const edad=document.getElementById("edad")?.value || "";
    const alojamiento=document.getElementById("alojamiento")?.value || "";
    const salida=document.getElementById("salida")?.value || "";
    const regreso=document.getElementById("regreso")?.value || "";
    const estancia=document.getElementById("estancia")?.value || "";
    const motivo=document.getElementById("motivo")?.value || "";
    const organizado=document.getElementById("organizado")?.value || "";
    const rvn=document.getElementById("rvn")?.value || "";
    const malaria=document.getElementById("malaria")?.value || "";

    const paisesSeleccionados=[
        document.getElementById("pais1")?.value || "",
        document.getElementById("pais2")?.value || "",
        document.getElementById("pais3")?.value || "",
        document.getElementById("pais4")?.value || ""
    ].filter(Boolean).join(", ");

    let dias="";

    if(salida && regreso){
        dias=Math.ceil(
            (new Date(regreso)-new Date(salida))
            /(1000*60*60*24)
        );
    }

    const vacunas=[];

    // Buscar en el contenedor actual
    const contentArea = document.getElementById("content-area");
    const container = contentArea || document;
    
    container.querySelectorAll('.vacunas input:checked').forEach(vacuna=>{
        vacunas.push(vacuna.value);
    });

    const resultadoDiv = document.getElementById("resultado");
    if(resultadoDiv) {
        resultadoDiv.innerHTML=`
<strong>RVN:</strong> ${rvn || "No especificado"}
<br><br>

Paciente <strong>${sexo}</strong>, de <strong>${edad}</strong> años, que consulta por viaje que va a realizar a <strong>${paisesSeleccionados || "No especificado"}</strong>.
<br>

Estancia en: <strong>${alojamiento}</strong>.
<br>

Salida el: <strong>${salida || "No especificada"}</strong>.
<br>

Regreso el: <strong>${regreso || "No especificado"}</strong>.
<br>

Duración del viaje: <strong>${dias} días</strong>.
<br>

Viaje <strong>${organizado === "Sí" ? "organizado" : "no organizado"}</strong> con estancia en <strong>${estancia || "No especificada"}</strong>.
<br>

Motivo del viaje: <strong>${motivo}</strong>.
<br><br>

Se valora riesgo de enfermedades transmitidas por picadura de mosquito y damos recomendaciones para evitarlas.
<br><br>

<strong>Vacunas administradas el día de hoy:</strong>
<br>

${vacunas.length ? vacunas.map(v => `• ${v}`).join("<br>") : "Ninguna vacuna seleccionada"}
<br><br>

<strong>Profilaxis frente a la malaria:</strong> ${malaria}.
<br><br>

<strong>Recomendaciones generales:</strong>
<br>
• Elegir ropa y calzado adecuados
<br>
• Los vestidos deberán ser de fibras naturales (algodón, lino, etc.), ligeros, no ajustados y de colores claros
<br>
• Usar repelente de insectos
<br>
• Mantener buena higiene personal
<br>
• Consultar con un médico antes del viaje
        `;
    }
}

// Agregar event listeners
document.addEventListener("input", actualizar);
document.addEventListener("change", actualizar);

// Ejecutar actualizar después de un pequeño delay
setTimeout(actualizar, 100);

</script>
