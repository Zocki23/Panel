<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="styles-content.css">
</head>
<body>
    <div class="container">
        <!-- Panel Lateral -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>Panel</h1>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-btn active" data-content="inicio">
                    <span class="icon">🏠</span>
                    <span class="text">Inicio</span>
                </button>
                <button class="nav-btn" data-content="viajeros">
                    <span class="icon">✈️</span>
                    <span class="text">Viajeros</span>
                </button>
                <button class="nav-btn" data-content="configuracion">
                    <span class="icon">⚙️</span>
                    <span class="text">Configuración</span>
                </button>
                <button class="nav-btn" data-content="contacto">
                    <span class="icon">📧</span>
                    <span class="text">Contacto</span>
                </button>
                <button class="nav-btn" data-content="aislamiento">
    <span class="icon">🛡️</span>
    <span class="text">Aislamiento</span>
</button>
            </nav>
        </aside>

        <!-- Contenido Principal -->
        <main class="main-content">
            <div class="content-area" id="content-area">
                <!-- El contenido se cargará aquí -->
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
